<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>农场升级 · 动物集市</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ============================================================
 * 农场升级页专属布局（farm- 前缀）· 颜色/字号/圆角一律用 token
 * ============================================================ */
.farm-body { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 0 16px 20px; }
.farm-body .rows { padding: 0; }

/* 入场 staggered 动画 */
@keyframes farm-in { from { opacity: 0; transform: translateY(12px); } }
.farm-body > * { animation: farm-in .45s ease both; }
.farm-body > *:nth-child(1) { animation-delay: .04s; }
.farm-body > *:nth-child(2) { animation-delay: .1s; }
.farm-body > *:nth-child(3) { animation-delay: .16s; }
.farm-body > *:nth-child(4) { animation-delay: .22s; }
.farm-rows .row { animation: farm-in .4s ease both; }
.farm-rows .row:nth-child(1) { animation-delay: .26s; }
.farm-rows .row:nth-child(2) { animation-delay: .3s; }
.farm-rows .row:nth-child(3) { animation-delay: .34s; }
.farm-rows .row:nth-child(4) { animation-delay: .38s; }
.farm-rows .row:nth-child(5) { animation-delay: .42s; }
.farm-rows .row:nth-child(6) { animation-delay: .46s; }
.farm-rows .row:nth-child(7) { animation-delay: .5s; }
.farm-rows .row:nth-child(8) { animation-delay: .54s; }

/* 1) 农场预览条 */
.farm-preview-strip {
  display: grid; grid-template-columns: repeat(8, 1fr); gap: 7px;
  padding: 6px 2px 2px;
}
.farm-slot {
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, .72);
  border: 1px dashed #c6d2da;
  border-radius: 11px;
  font-size: 22px; line-height: 1;
  transition: border-color .3s, background .3s;
}
.farm-slot.is-owned {
  border-style: solid; border-color: rgba(88, 192, 108, .75);
  background: #eef9ef;
  filter: drop-shadow(0 3px 4px rgba(90, 130, 95, .35));
  animation: farmPop .45s ease;
}
@keyframes farmPop { 0% { transform: scale(.3); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }
.farm-preview-sub { font-size: 12px; color: var(--muted); margin-top: 11px; }

/* 2) 加成卡 */
.farm-bonus-top { display: flex; align-items: center; gap: 10px; }
.farm-bonus-top > .ic { color: var(--green); flex: none; }
.farm-bonus-txt { flex: 1; min-width: 0; }
.farm-bonus-txt b { display: block; font-size: 15px; }
.farm-bonus-txt p { font-size: 12px; color: var(--muted); margin-top: 2px; }
.farm-bonus-num { font-size: 26px; font-weight: 800; color: var(--green); line-height: 1; }
.farm-bonus-bar { display: flex; align-items: center; gap: 10px; margin-top: 13px; }
.farm-bonus-bar .bar { flex: 1; }
.farm-bonus-sub { font-size: 12px; color: var(--muted); margin-top: 9px; }

/* 3) 赚钱提示条 */
.farm-tip { display: flex; align-items: center; gap: 12px; transition: border-color .15s; }
.farm-tip > .ic:first-child { color: var(--gold); }
.farm-tip:active { transform: scale(.99); }
.farm-tip-txt { flex: 1; min-width: 0; }
.farm-tip-txt b { display: block; font-size: 14.5px; }
.farm-tip-txt span { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.farm-tip-arrow { color: var(--muted); transform: rotate(180deg); transition: color .15s, transform .15s; }
.farm-tip:hover { border-color: rgba(255, 157, 43, .6); }
.farm-tip:hover .farm-tip-arrow { color: var(--gold); transform: rotate(180deg) translateX(3px); }

/* 4) 商店行 */
.farm-face { width: 44px; height: 44px; flex: none; display: flex; align-items: center; justify-content: center; background: var(--bg3); border: 1px solid var(--rule); border-radius: 12px; font-size: 26px; line-height: 1; }
.farm-item .grow b { display: flex; align-items: center; gap: 7px; }
.farm-item.is-owned .farm-face { border-color: rgba(88, 192, 108, .6); background: #eef9ef; }
.farm-price { display: inline-flex; align-items: center; gap: 4px; font-family: var(--font-num); font-size: 14px; font-weight: 700; color: var(--gold-deep); flex: none; }
.farm-price .ic { width: 14px; height: 14px; }
.farm-price.is-poor { color: var(--danger); opacity: .85; }
.farm-buy { min-width: 74px; flex: none; }
</style>
</head>

  <script>
  (function () {
    'use strict';
    var AM = window.AM;

    var CHECK_SM = '<svg class="ic ic--sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
    var COINS_SM = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg>';

    var stripEl = document.getElementById('farmStrip');
    var shopEl = document.getElementById('farmShop');
    var owned = AM.wallet.data.owned;

    /* ---- 预览条：8 格，已建成的放装饰 ---- */
    function renderStrip() {
      var html = '';
      AM.DB.decorations.forEach(function (d) {
        var has = owned.indexOf(d.id) >= 0;
        html += '<span class="farm-slot' + (has ? ' is-owned' : '') + '" title="' + (has ? d.name : '空地') + '">' + (has ? d.emoji : '') + '</span>';
      });
      stripEl.innerHTML = html;
      document.getElementById('farmPreviewSub').innerHTML =
        owned.length >= AM.DB.decorations.length
          ? '农场全盖满了，灯火通明，好一个夜市大庄园'
          : '空地上还能盖 <span class="num">' + (AM.DB.decorations.length - owned.length) + '</span> 件，接着攒钱';
    }

    /* ---- 加成卡 ---- */
    function renderBonus() {
      var n = owned.length, total = AM.DB.decorations.length;
      document.getElementById('farmBonusNum').textContent = '+' + (n * 2) + '%';
      document.getElementById('farmBonusBar').style.width = (n / total * 100) + '%';
      document.getElementById('farmBonusSub').innerHTML = '已建成 <span class="num">' + n + '</span>/' + total + ' 件';
    }

    /* ---- 商店行 ---- */
    function renderShop() {
      var coins = AM.wallet.coins;
      var html = '';
      AM.DB.decorations.forEach(function (d) {
        var has = owned.indexOf(d.id) >= 0;
        html += '<div class="row farm-item' + (has ? ' is-owned' : '') + '">' +
          '<span class="farm-face">' + d.emoji + '</span>' +
          '<div class="grow"><b>' + d.name + '</b><span class="sub">' + d.desc + '</span></div>' +
          (has
            ? '<span class="chip chip--green">' + CHECK_SM + '已建成</span>'
            : '<span class="farm-price' + (coins < d.price ? ' is-poor' : '') + '">' + COINS_SM + d.price + '</span>' +
              '<button type="button" class="btn btn--sm farm-buy" data-id="' + d.id + '">建造</button>') +
        '</div>';
      });
      shopEl.innerHTML = html;
    }

    function renderAll() { renderStrip(); renderBonus(); renderShop(); }
    renderAll();

    /* ---- 购买：走接口桩，成功后整页状态刷新 ---- */
    shopEl.addEventListener('click', function (e) {
      var btn = e.target && e.target.closest ? e.target.closest('.farm-buy') : null;
      if (!btn || btn.disabled) return;
      var id = btn.getAttribute('data-id');
      btn.disabled = true;
      btn.classList.add('is-disabled');
      btn.textContent = '建造中';
      AM.api.buyDecoration(id).then(function (res) {
        AM.toast(res.msg);
        renderAll();
      });
    });
  })();
  </script>
