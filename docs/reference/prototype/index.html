<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首页 · 农场 · 动物集市</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ===== 页面专属布局：首页 · 农场（home-*） ===== */
.home-body {
  flex: 1; min-height: 0; overflow-y: auto;
  display: flex; flex-direction: column; gap: 12px;
  padding: 0 16px 16px;
}
.home-body::-webkit-scrollbar { width: 0; }

/* 入场：卡片依次上浮 */
@keyframes homeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
.home-body > * { animation: homeUp .5s ease both; }
.home-body > *:nth-child(1) { animation-delay: .05s; }
.home-body > *:nth-child(2) { animation-delay: .13s; }
.home-body > *:nth-child(3) { animation-delay: .21s; }
.home-body > *:nth-child(4) { animation-delay: .29s; }
.home-body > *:nth-child(5) { animation-delay: .37s; }

/* 1) 农场白天 Hero（纯 CSS 场景） */
.home-hero {
  position: relative; height: 200px; flex: none;
  border: 1px solid #e6ecf1;
  border-radius: 16px;
  overflow: hidden;
  background:
    radial-gradient(80% 55% at 76% 16%, rgba(255, 214, 102, .55), transparent 60%),
    linear-gradient(180deg, #7cc8f2 0%, #a5dff6 46%, #d3efda 100%);
  box-shadow: 0 3px 10px rgba(120, 150, 180, .12);
}
.home-sun {
  position: absolute; top: 20px; right: 46px;
  width: 46px; height: 46px; border-radius: 50%;
  background: radial-gradient(circle at 38% 32%, #ffe9a8, #ffd24d 74%);
  box-shadow: 0 0 22px rgba(255, 210, 77, .85), 0 0 60px rgba(255, 210, 77, .4);
}
.home-cloud {
  position: absolute; top: 30px; left: 26px;
  width: 56px; height: 18px; border-radius: 999px;
  background: rgba(255, 255, 255, .92);
  animation: homeDrift 6s ease-in-out infinite alternate;
}
.home-cloud::before {
  content: ''; position: absolute; top: -9px; left: 12px;
  width: 22px; height: 22px; border-radius: 50%;
  background: rgba(255, 255, 255, .92);
}
.home-cloud::after {
  content: ''; position: absolute; top: -5px; right: 9px;
  width: 15px; height: 15px; border-radius: 50%;
  background: rgba(255, 255, 255, .92);
}
@keyframes homeDrift { from { transform: translateX(0); } to { transform: translateX(26px); } }
.home-grass {
  position: absolute; left: -8px; right: -8px; bottom: -8px; height: 88px;
  border-radius: 46% 54% 0 0 / 82% 68% 0 0;
  background:
    repeating-linear-gradient(115deg, transparent 0 9px, rgba(88, 192, 108, .1) 9px 18px),
    linear-gradient(180deg, #8ed89a, #5fba70 38%, #4aa75c);
}
.home-animal {
  position: absolute; line-height: 1;
  animation: homeWalk 3.4s ease-in-out infinite alternate;
  filter: drop-shadow(0 3px 3px rgba(40, 90, 45, .35));
}
.home-animal svg { width: 100%; height: 100%; display: block; }
@keyframes homeWalk { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
.home-deco { position: absolute; bottom: 8px; line-height: 1; font-size: 34px; filter: drop-shadow(0 4px 6px rgba(40, 90, 45, .4)); }
.home-deco--l { left: 10px; }
.home-deco--r { right: 8px; bottom: 4px; }

/* 2) 关卡 CTA 卡 */
.home-cta-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
.home-cta-txt h2 { font-size: 20px; font-weight: 800; }
.home-cta-txt p { font-size: 13px; color: var(--muted); margin-top: 4px; }
.home-cta-stars { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.home-star-row { display: flex; gap: 3px; }
.home-star { width: 26px; height: 26px; color: var(--muted); }
.home-star.is-got { color: var(--gold); fill: var(--gold); filter: drop-shadow(0 2px 4px rgba(255, 157, 43, .55)); }
.home-cta-stars small { font-size: 11px; color: var(--muted); }

/* 3) 每日挑战横幅 */
.home-banner { display: flex; align-items: center; gap: 12px; transition: border-color .15s, transform .1s; }
.home-banner > .ic:first-child { color: var(--green); }
.home-banner:active { transform: scale(.99); }
.home-banner-txt { flex: 1; min-width: 0; }
.home-banner-txt b { display: block; font-size: 15px; }
.home-joined { display: block; font-size: 12px; color: var(--muted); margin-top: 2px; }
.home-arrow { color: var(--muted); transform: rotate(180deg); transition: transform .15s, color .15s; }
.home-banner:hover { border-color: rgba(88, 192, 108, .7); }
.home-banner:hover .home-arrow { color: var(--green); transform: rotate(180deg) translateX(3px); }

/* 4) 签到卡 */
.home-sign { display: flex; align-items: center; gap: 12px; }
.home-sign > .ic { color: var(--gold); }
.home-sign-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 5px; }
.home-sign-txt b { font-size: 15px; }
.home-sign-right { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.home-sign-today { display: flex; align-items: center; gap: 6px; }

/* 5) 图鉴进度卡 */
.home-col-top { display: flex; align-items: center; gap: 8px; }
.home-col-top > .ic { color: var(--gold); }
.home-col-top b { flex: 1; font-size: 15px; }
.home-col-bar { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.home-col-bar .bar { flex: 1; }
.home-col-bar .num { font-size: 13px; font-weight: 700; }
.home-col-sub { font-size: 12px; color: var(--muted); margin-top: 8px; }
</style>
</head>

  <script>
  (function () {
    'use strict';

    /* 关卡 / 挑战主题 / 参加人数 / 连续签到 —— 关卡读本地进度（通关数+1），其余读单一数据源 AM.DB */
    var curLv = 1;
    try { curLv = Math.min(30, Math.max(1, parseInt(localStorage.getItem('am_level'), 10) || 1)); } catch (e) { }
    document.getElementById('homeLevel').textContent = '第' + curLv + '关 · 集市';
    document.getElementById('homeCtaSub').textContent = '目标：清空牧场所有动物 · 生命 3 颗';
    document.querySelector('.card--cta .btn--lg').href = 'game.html?lv=' + curLv;
    document.getElementById('homeDailyTitle').textContent = '每日挑战 · ' + AM.DB.daily.theme;
    document.getElementById('homeJoined').innerHTML = '<b class="num">' + AM.DB.daily.joined.toLocaleString() + '</b> 人已参加';
    document.getElementById('homeStreak').innerHTML = '连续 <b class="num">' + AM.DB.signin.streak + '</b> 天';

    /* 牧场白天：走地动物换 Q 版 SVG */
    document.querySelectorAll('.home-animal').forEach(function (el) {
      var id = el.getAttribute('data-animal');
      if (id) el.innerHTML = AM.animals.svg(id);
    });

    /* 签到状态：今天已领过就收起红点、按钮置灰 */
    var w = AM.wallet.data;
    if (w.signinDone && w.signinDone[w.signinDay]) {
      document.getElementById('homeSignChip').textContent = '今日已领';
      document.getElementById('homeSignDot').style.display = 'none';
      var sBtn = document.getElementById('homeSignBtn');
      sBtn.classList.add('is-disabled');
      sBtn.textContent = '已签到';
    }

    /* 农场装饰：已拥有的装饰放上场景两侧 */
    var owned = w.owned || [];
    var slots = [document.getElementById('homeDecoL'), document.getElementById('homeDecoR')];
    var used = 0;
    for (var i = 0; i < AM.DB.decorations.length && used < slots.length; i++) {
      if (owned.indexOf(AM.DB.decorations[i].id) >= 0) {
        slots[used].textContent = AM.DB.decorations[i].emoji;
        slots[used].title = AM.DB.decorations[i].name;
        used++;
      }
    }
  })();
  </script>
