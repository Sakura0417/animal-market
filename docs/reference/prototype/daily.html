<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日挑战 · 动物集市</title>
<link rel="stylesheet" href="styles.css">
<style>
/* ============================================================
 * 每日挑战页专属布局（daily- 前缀）· 颜色/字号/圆角一律用 token
 * ============================================================ */
.daily-body { flex: 1; display: flex; flex-direction: column; gap: 14px; padding: 0 16px 20px; }
.daily-body .rows { padding: 0; }

/* 入场 staggered 动画 */
@keyframes daily-in { from { opacity: 0; transform: translateY(14px); } }
.daily-body > * { animation: daily-in .5s cubic-bezier(.22, .9, .3, 1) both; }
.daily-body > *:nth-child(1) { animation-delay: .04s; }
.daily-body > *:nth-child(2) { animation-delay: .1s; }
.daily-body > *:nth-child(3) { animation-delay: .16s; }
.daily-body > *:nth-child(4) { animation-delay: .22s; }
.daily-body > *:nth-child(5) { animation-delay: .28s; }
.daily-rows .row { animation: daily-in .4s ease both; }
.daily-rows .row:nth-child(1) { animation-delay: .34s; }
.daily-rows .row:nth-child(2) { animation-delay: .39s; }
.daily-rows .row:nth-child(3) { animation-delay: .44s; }
.daily-rows .row:nth-child(4) { animation-delay: .49s; }
.daily-rows .row:nth-child(5) { animation-delay: .54s; }
.daily-rows .row:nth-child(6) { animation-delay: .59s; }
.daily-rows .row:nth-child(7) { animation-delay: .64s; }

/* 今日挑战卡 */
.daily-hero-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.daily-hero-title { display: flex; align-items: flex-start; gap: 10px; min-width: 0; }
.daily-hero-ic { color: var(--gold); flex: none; display: flex; }
.daily-hero-name b { display: block; font-size: 15px; line-height: 1.4; }
.daily-hero-name > span { display: block; font-size: 12px; color: var(--muted); margin-top: 1px; }
.daily-joined { display: flex; align-items: baseline; gap: 8px; margin: 14px 2px 12px; }
.daily-joined b { font-size: 32px; font-weight: 800; color: var(--gold-deep); line-height: 1; }
.daily-joined > span { font-size: 12px; color: var(--muted); }
.daily-mine { display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, .65); border: 1px solid var(--rule); border-radius: 12px; padding: 7px 12px; }
.daily-mine > span:first-child { font-size: 12px; color: var(--muted); }
.daily-mine-score { font-size: 20px; font-weight: 800; color: var(--green); line-height: 1; }

/* 参战按钮 */
.daily-cta-note { font-size: 12px; color: var(--muted); text-align: center; margin-top: 8px; }

/* 击败百分比卡 */
.daily-beat-top { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.daily-beat-top > b { font-size: 32px; font-weight: 800; color: var(--gold-deep); line-height: 1; }
.daily-beat-top > span { font-size: 12px; color: var(--muted); }
.daily-beat-locked { font-size: 13px; color: var(--muted); }

/* 榜单 tabs（active 态由页面类 is-active 实现） */
.daily-tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.daily-tab { padding: 9px 0; border-radius: 11px; border: 1px solid var(--rule); background: var(--bg3); color: var(--muted); font-size: 14px; font-weight: 700; cursor: pointer; transition: color .15s, border-color .15s, background .15s; }
.daily-tab:hover { color: var(--ink); }
.daily-tab.is-active { color: var(--gold-deep); border-color: rgba(255, 157, 43, .65); background: #fff3dd; font-weight: 800; }

/* 榜单行 */
.daily-rankbadge { width: 28px; flex: none; display: flex; align-items: center; justify-content: center; }
.daily-medal { display: flex; }
.daily-medal--1 { color: var(--gold); }
.daily-medal--2 { color: var(--green); }
.daily-medal--3 { color: var(--sky); }
.daily-rankno { min-width: 26px; height: 26px; padding: 0 4px; display: flex; align-items: center; justify-content: center; border-radius: 8px; background: var(--bg3); border: 1px solid var(--rule); font-size: 13px; color: var(--muted); }
.daily-avatar { width: 36px; height: 36px; flex: none; border-radius: 50%; background: var(--bg3); border: 1px solid var(--rule); display: flex; align-items: center; justify-content: center; font-size: 20px; overflow: hidden; }
.daily-avatar .am-animal { width: 28px; height: 28px; }
.daily-name { display: flex; align-items: center; gap: 7px; }
.daily-name b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.daily-score { font-size: 15px; font-weight: 700; color: var(--gold); }
.daily-rank.is-me { border-color: rgba(255, 157, 43, .7); background: #fff8ec; }
</style>
</head>

    </nav>

  <script>
  (function () {
    'use strict';
    var AM = window.AM;
    var daily = AM.DB.daily;

    var MEDAL_SVG = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.21 15 2.66 7.14a2 2 0 0 1 .13-2.2L4.4 2.8A2 2 0 0 1 6 2h12a2 2 0 0 1 1.6.8l1.6 2.14a2 2 0 0 1 .14 2.2L16.79 15"/><path d="M11 12 5.12 2.2"/><path d="m13 12 5.88-9.8"/><path d="M8 7h8"/><circle cx="12" cy="17" r="5"/><path d="M12 18v-2h-.5"/></svg>';

    function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }

    /* ---- 今日挑战卡（数据只读 AM.DB） ---- */
    document.getElementById('dailySeed').textContent = daily.seed;
    document.getElementById('dailyLeft').textContent = daily.deadlineHours;
    document.getElementById('dailyJoined').textContent = fmt(daily.joined);

    var mineEl = document.getElementById('dailyMine');
    mineEl.innerHTML = daily.score > 0
      ? '<b class="num daily-mine-score">' + daily.score + '</b>'
      : '<span class="chip">今日未挑战</span>';

    /* ---- 击败百分比卡：score=0 时灰态 ---- */
    var beatEl = document.getElementById('dailyBeat');
    beatEl.innerHTML = daily.score > 0
      ? '<div class="daily-beat-top"><b class="num">' + daily.beat + '%</b><span>今日击败了 <span class="num">' + daily.beat + '%</span> 的玩家</span></div><div class="bar"><div class="bar-fill" style="width:' + daily.beat + '%"></div></div>'
      : '<p class="daily-beat-locked">完成今日挑战后查看排名</p>';

    /* ---- 榜单：好友榜 / 省份榜，JS 切换渲染 ---- */
    var rankEl = document.getElementById('dailyRank');
    var tabs = document.querySelectorAll('.daily-tab');
    var current = 'friends';

    function renderRank(key) {
      var list = daily[key].slice().sort(function (a, b) { return b.score - a.score; });
      var html = '';
      for (var i = 0; i < list.length; i++) {
        var p = list[i];
        var isMe = p.name === '我';
        var badge = i < 3
          ? '<span class="daily-medal daily-medal--' + (i + 1) + '">' + MEDAL_SVG + '</span>'
          : '<span class="daily-rankno num">' + (i + 1) + '</span>';
        html += '<div class="row daily-rank' + (isMe ? ' is-me' : '') + '">' +
          '<span class="daily-rankbadge">' + badge + '</span>' +
          '<span class="daily-avatar">' + (AM.animals.has(p.avatar) ? AM.animals.svg(p.avatar) : p.avatar) + '</span>' +
          '<div class="grow daily-name"><b>' + p.name + '</b>' + (isMe ? '<span class="chip chip--gold">我</span>' : '') + '</div>' +
          '<b class="num daily-score">' + p.score + '</b>' +
        '</div>';
      }
      rankEl.innerHTML = html;
    }

    for (var t = 0; t < tabs.length; t++) {
      (function (btn) {
        btn.addEventListener('click', function () {
          var key = btn.getAttribute('data-list');
          if (key === current) return;
          current = key;
          for (var k = 0; k < tabs.length; k++) tabs[k].classList.toggle('is-active', tabs[k] === btn);
          renderRank(key);
        });
      })(tabs[t]);
    }

    renderRank(current);
  })();
  </script>
</body>
