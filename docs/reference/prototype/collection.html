<style>
/* ============================================================
 * 动物图鉴页专属布局（col- 前缀）· 颜色/字号/圆角一律用 token
 * ============================================================ */
.col-body { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 0 16px 20px; }

/* 入场 staggered 动画 */
@keyframes col-in { from { opacity: 0; transform: translateY(12px); } }
.col-body > * { animation: col-in .45s ease both; }
.col-body > *:nth-child(1) { animation-delay: .04s; }
.col-body > *:nth-child(2) { animation-delay: .1s; }
.col-body > *:nth-child(3) { animation-delay: .16s; }
.col-body > *:nth-child(4) { animation-delay: .22s; }
.col-body > *:nth-child(5) { animation-delay: .28s; }
.col-body > *:nth-child(6) { animation-delay: .34s; }
.col-grid .col-card { animation: col-in .4s ease both; }
.col-grid .col-card:nth-child(1) { animation-delay: .3s; }
.col-grid .col-card:nth-child(2) { animation-delay: .34s; }
.col-grid .col-card:nth-child(3) { animation-delay: .38s; }
.col-grid .col-card:nth-child(4) { animation-delay: .42s; }
.col-grid .col-card:nth-child(5) { animation-delay: .46s; }
.col-grid .col-card:nth-child(6) { animation-delay: .5s; }

/* 1) 进度 + 集齐奖励卡 */
.col-progress-top { display: flex; align-items: center; gap: 9px; }
.col-progress-top > .ic { color: var(--gold); }
.col-progress-top b { flex: 1; font-size: 15px; }
.col-progress-top .num { font-size: 20px; font-weight: 800; color: var(--gold); }
.col-progress-bar { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
.col-progress-bar .bar { flex: 1; }
.col-progress-sub { font-size: 12px; color: var(--muted); margin-top: 9px; }
.col-rewards { display: flex; flex-direction: column; gap: 8px; margin-top: 13px; }
.col-reward {
  display: flex; align-items: center; gap: 9px;
  background: var(--bg3); border: 1px solid var(--rule);
  border-radius: 11px; padding: 9px 12px;
}
.col-reward .ic { flex: none; color: var(--muted); }
.col-reward-txt { flex: 1; min-width: 0; }
.col-reward-txt b { display: block; font-size: 13.5px; }
.col-reward-txt span { display: block; font-size: 11.5px; color: var(--muted); }
.col-reward.is-near { border-color: rgba(255, 157, 43, .55); }
.col-reward.is-near .ic { color: var(--gold); }
.col-reward.is-done .ic { color: var(--green); }

/* 2) 图鉴卡网格 */
.col-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding: 0; }
.col-card {
  background: var(--bg2); border: 1px solid var(--rule);
  border-radius: 14px; padding: 13px 6px 11px;
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  text-align: center; cursor: pointer; color: inherit;
  transition: border-color .15s, transform .1s;
}
.col-card:hover { border-color: rgba(88, 192, 108, .7); }
.col-card:active { transform: scale(.96); }
.col-face { position: relative; display: flex; align-items: center; justify-content: center; width: 48px; height: 48px; line-height: 1; filter: drop-shadow(0 3px 4px rgba(120, 150, 180, .35)); }
.col-face .am-animal { width: 46px; height: 46px; }
.col-card b { font-size: 13.5px; line-height: 1.3; }
.col-card small { font-size: 11px; color: var(--muted); }
.col-card small .num { font-size: 11.5px; }

/* 闪光卡：金光描边 */
.col-card--rare {
  border-color: rgba(255, 184, 0, .6);
  background: linear-gradient(165deg, #fff8e0, #fffdf6 60%), var(--bg2);
}
.col-card--rare .col-face { filter: drop-shadow(0 0 7px rgba(255, 184, 0, .8)) drop-shadow(0 3px 4px rgba(120, 150, 180, .3)); }
.col-card--rare b { color: #d99a00; }

/* 未点亮卡：压灰 + 角标锁 */
.col-card--locked { opacity: .62; }
.col-card--locked .col-face { filter: grayscale(1) brightness(.8); }
.col-lock {
  position: absolute; right: -7px; bottom: -3px;
  width: 14px; height: 14px; color: var(--muted);
  background: var(--bg2); border-radius: 50%; padding: 2px;
}
.col-card--hidden .col-face .ic { width: 30px; height: 30px; color: var(--muted); }
</style>

  <script>
  (function () {
    'use strict';
    var AM = window.AM;

    var LOCK_SM = '<svg class="ic col-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';
    var LOCK_LG = '<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

    function esc(s) { return String(s); }

    /* ---- 基础动物：全部解锁（n>0） ---- */
    var normalEl = document.getElementById('colNormal');
    var htmlN = '';
    AM.DB.animals.forEach(function (t) {
      var c = AM.DB.collection[t.id];
      htmlN +=
        '<button type="button" class="col-card" data-tip="' + esc(t.name) + ' · 单价 ' + t.price + ' 金币 · 累计售出 ' + c.n + ' 只">' +
          '<span class="col-face">' + AM.animals.svg(t.id) + '</span>' +
          '<b>' + esc(t.name) + '</b>' +
          '<small>售出 <span class="num">' + c.n + '</span> 只</small>' +
        '</button>';
    });
    normalEl.innerHTML = htmlN;

    /* ---- 闪光变种：rare>0 解锁，否则锁卡 ---- */
    var rareEl = document.getElementById('colRare');
    var htmlR = '';
    AM.DB.animals.forEach(function (t) {
      var c = AM.DB.collection[t.id];
      if (c.rare > 0) {
        htmlR +=
          '<button type="button" class="col-card col-card--rare" data-tip="闪光' + esc(t.name) + ' · 3 倍价收购 · 累计售出 ' + c.rare + ' 只">' +
            '<span class="col-face">' + AM.animals.svg(t.id, { rare: true }) + '</span>' +
            '<b>闪光' + esc(t.name) + '</b>' +
            '<small>售出 <span class="num">' + c.rare + '</span> 只</small>' +
          '</button>';
      } else {
        htmlR +=
          '<button type="button" class="col-card col-card--locked" data-tip="卖出一只闪光' + esc(t.name) + '就点亮啦，闪光会随机混进牧场">' +
            '<span class="col-face">' + AM.animals.svg(t.id) + LOCK_SM + '</span>' +
            '<b>闪光' + esc(t.name) + '</b>' +
            '<small>待点亮</small>' +
          '</button>';
      }
    });
    rareEl.innerHTML = htmlR;

    /* ---- 隐藏稀客：全部未解锁 ---- */
    var hiddenEl = document.getElementById('colHidden');
    var htmlH = '';
    AM.DB.hidden.forEach(function (t) {
      htmlH +=
        '<button type="button" class="col-card col-card--locked col-card--hidden" data-tip="第 8 关后有 3% 概率出现在牧场，收一只就点亮">' +
          '<span class="col-face">' + LOCK_LG + '</span>' +
          '<b>？？？</b>' +
          '<small>第 8 关后出现</small>' +
        '</button>';
    });
    hiddenEl.innerHTML = htmlH;

    /* ---- 点击卡片：toast 展示详情 ---- */
    document.querySelectorAll('.col-card').forEach(function (card) {
      card.addEventListener('click', function () {
        AM.toast(card.getAttribute('data-tip'));
      });
    });
  })();
  </script>
